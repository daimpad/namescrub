name: Build & Release NameScrub+

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release-Tag (z.B. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: NameScrub.exe
            asset_name: NameScrub-windows.exe
          - os: ubuntu-latest
            artifact: NameScrub
            asset_name: NameScrub-linux
          - os: macos-latest
            artifact: NameScrub
            asset_name: NameScrub-macos

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install spacy pyinstaller Pillow

      - name: Cache spaCy model
        id: cache-spacy
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.tool_cache }}/spacy-models
          key: spacy-de_core_news_lg-${{ runner.os }}

      - name: Download spaCy model
        if: steps.cache-spacy.outputs.cache-hit != 'true'
        run: python -m spacy download de_core_news_lg

      - name: Restore spaCy model from cache
        if: steps.cache-spacy.outputs.cache-hit == 'true'
        shell: bash
        run: |
          MODEL_CACHE="${{ runner.tool_cache }}/spacy-models"
          if [ -d "$MODEL_CACHE" ]; then
            pip install --no-index --find-links="$MODEL_CACHE" de_core_news_lg || true
          fi

      - name: Save spaCy model to cache
        if: steps.cache-spacy.outputs.cache-hit != 'true'
        shell: bash
        run: |
          MODEL_CACHE="${{ runner.tool_cache }}/spacy-models"
          mkdir -p "$MODEL_CACHE"
          pip download de_core_news_lg --no-deps -d "$MODEL_CACHE" || true

      - name: Build executable
        run: python cli/build_exe.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Rename artifact (Unix)
        if: matrix.os != 'windows-latest'
        run: mv cli/dist/NameScrub cli/dist/${{ matrix.asset_name }}

      - name: Rename artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Rename-Item cli/dist/NameScrub.exe ${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: cli/dist/${{ matrix.asset_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: NameScrub+ ${{ steps.tag.outputs.name }}
          body: |
            ## NameScrub+ ${{ steps.tag.outputs.name }}

            Desktop-App für maximale Anonymisierungsgenauigkeit — KI-basiert mit spaCy NER, 100% lokal.

            ### Installation

            1. Datei für dein Betriebssystem herunterladen
            2. Beim ersten Start einmalig das KI-Modell installieren:
            ```
            pip install spacy
            python -m spacy download de_core_news_lg
            ```
            3. App starten — fertig.

            ### Downloads

            | Betriebssystem | Datei |
            |---|---|
            | Windows | `NameScrub-windows.exe` |
            | macOS | `NameScrub-macos` |
            | Linux | `NameScrub-linux` |

            > Die App benötigt Python + spaCy auf deinem Rechner (kein Cloud-Dienst, alles lokal).

            ---
            **NameScrub Web** (ohne Installation): [namescrub.nozilla.net](https://namescrub.nozilla.net)
          files: |
            artifacts/NameScrub-windows.exe/NameScrub-windows.exe
            artifacts/NameScrub-linux/NameScrub-linux
            artifacts/NameScrub-macos/NameScrub-macos
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
