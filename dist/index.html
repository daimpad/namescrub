<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="NameScrub — Anonymisierung deutscher Texte. 100% lokal, keine Daten verlassen Ihren Browser." />
  <meta name="robots" content="index, follow" />
  <title>NameScrub — Texte lokal anonymisieren</title>
  <link rel="icon" type="image/png" href="./favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="shortcut icon" href="./favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="namescrub" />
  <link rel="manifest" href="./site.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@700&family=Inter:wght@400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="./assets/main-CrkCi1xx.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/main-Xpn6t6ZV.css">
</head>
<body>

<header>
  <div class="header-left">
    <img src="./assets/namescrub_logo_long-DztGhtOR.svg" alt="NameScrub" class="header-logo" />
    <span class="header-sub">Text rein. Sensible Daten raus.</span>
  </div>
  <span id="header-status" class="header-status"></span>
</header>

<main>

  <div class="input-hint" id="input-hint">Text einfügen und Analyse starten.</div>

  <div class="panel input-panel">
    <div class="panel-label">Eingabe</div>
    <textarea
      id="input"
      placeholder="Deutschen Text hier einfügen…&#10;&#10;Tipp: Strg+Enter startet die Analyse."
      spellcheck="false"
      autocomplete="off"
    ></textarea>
  </div>

  <div class="panel output-panel">
    <div class="panel-label">Ergebnis — Namen anklicken für Optionen</div>
    <div id="output" aria-live="polite" aria-label="Analysierter Text"></div>
  </div>

  <div class="controls">
    <span id="status" class="status-hidden" aria-live="polite"></span>
    <button id="btn-analyse" disabled>Analyse starten</button>
    <button id="btn-purge"   disabled>Alle ersetzen</button>
    <button id="btn-copy"    disabled>In Zwischenablage kopieren</button>
  </div>

  <div class="legend">
    <span id="stats"></span>
    <span class="legend-item">
      <span class="legend-swatch name"></span> Möglicher Name → klicken
    </span>
    <span class="legend-item">
      <span class="legend-swatch honorific"></span> Name nach Anrede
    </span>
    <span class="legend-item">
      <span class="legend-swatch replaced"></span> Name-X ersetzt
    </span>
  </div>

</main>

<footer>
  <nav class="footer-links">
    <a href="https://nozilla.de/impressum" target="_blank" rel="noopener">Impressum</a>
    <a href="https://nozilla.de/datenschutz" target="_blank" rel="noopener">Datenschutz</a>
    <a href="https://nozilla.de/kontakt" target="_blank" rel="noopener">Kontakt</a>

      GitHub
    </a>
  </nav>

</body>
</html>
